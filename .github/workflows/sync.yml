name: Sync calendars

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan changes without writing
        type: boolean
        default: false

concurrency:
  group: calendar-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sync
        run: npm run ${{ inputs.dry_run && 'sync:dry' || 'sync' }}
        env:
          TARGET_CALENDAR_ID: ${{ secrets.TARGET_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
